version: '3.8'

services:
  agent:
    image: portainer/agent:2.21.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ce:2.21.3
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      - agent_network
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        # Thay đổi portainer.yourdomain.com thành tên miền thật trỏ về VPS của em
        - "traefik.http.routers.portainer.rule=Host(`portainer.yourdomain.com`)"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.routers.portainer.tls=true"
        - "traefik.http.routers.portainer.tls.certresolver=productionresolver"  # Sử dụng resolver đã khai báo trong Traefik Production
        - "traefik.http.routers.portainer.service=portainer-service"
        - "traefik.http.services.portainer-service.loadbalancer.server.port=9000"
        - "traefik.swarm.network=traefik-public"

networks:
  agent_network:
    driver: overlay
    attachable: true
  traefik-public:
    external: true

volumes:
  portainer_data:
