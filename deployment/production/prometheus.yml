global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api:8080']

  - job_name: 'ws-service'
    static_configs:
      - targets: ['ws-service:8082']

  - job_name: 'bus-service'
    static_configs:
      - targets: ['bus-service:9091']

  - job_name: 'booking-service'
    static_configs:
      - targets: ['booking-service:9092']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:9093']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:9094']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:9095']
