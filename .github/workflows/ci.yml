name: Bus Booking System CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  test:
    name: Run Vet and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Vet (Static Analysis)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...
