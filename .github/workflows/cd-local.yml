name: Go CD Local

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'staging-*'

jobs:
  build-and-push:
    name: Build & Push Docker Images (Local)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          api,
          booking-service,
          bus-service,
          payment-service,
          notification-service,
          user-service,
          ws-service
        ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (For multi-platform support)
        if: ${{ !env.ACT }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Local Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Image
        run: |
          mkdir -p $HOME/.ssh
          rm -f $HOME/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa

          DOCKER_BUILDKIT=1 docker buildx build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --secret id=privkey,src=$HOME/.ssh/id_rsa \
            -t ${{ secrets.DOCKER_REGISTRY }}/bus-booking-${{ matrix.service }}:${{ github.ref_name }} \
            -f ./Dockerfile --push .

          rm -f $HOME/.ssh/id_rsa

      - name: Prune Docker
        continue-on-error: true
        run: |
          docker image prune -af
          docker builder prune -af

  deploy:
    name: Deploy to Swarm Cluster (Local)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Stack via SSH (Local)
        run: |
          mkdir -p ~/.ssh
          # Sử dụng trực tiếp file key lưu ở folder local
          cp ./deployment/local/id_rsa ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh-keyscan -H 192.168.220.128 >> ~/.ssh/known_hosts 2>/dev/null
          
          # Copy file stack ứng dụng sang máy ảo Swarm Manager
          scp -i ~/.ssh/id_rsa ./deployment/local/app-stack.yml manager@192.168.220.128:/home/manager/app-stack.yml
          
          # Deploy lên cụm Swarm
          ssh -i ~/.ssh/id_rsa manager@192.168.220.128 "DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }} TAG=${{ github.ref_name }} docker stack deploy -c /home/manager/app-stack.yml bus-booking"
          
          rm -f ~/.ssh/id_rsa
