name: Go CD

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'staging-*'

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          api,
          booking-service,
          bus-service,
          payment-service,
          notification-service,
          user-service,
          ws-service
        ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (For multi-platform support)
        if: ${{ !env.ACT }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Image
        run: |
          mkdir -p $HOME/.ssh
          
          rm -f $HOME/.ssh/id_rsa
          
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa

          DOCKER_BUILDKIT=1 docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --secret id=privkey,src=$HOME/.ssh/id_rsa \
            -t ${{ secrets.DOCKER_REGISTRY }}/bus-booking-${{ matrix.service }}:${{ github.ref_name }} \
            -f ./Dockerfile .

          rm -f $HOME/.ssh/id_rsa
      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_REGISTRY }}/bus-booking-${{ matrix.service }}:${{ github.ref_name }}
      - name: Prune Docker
        run: |
          docker image prune -af
          docker builder prune -af