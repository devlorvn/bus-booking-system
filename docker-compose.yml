version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: bus-booking-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bus_booking
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: bus-booking-redis
    restart: always
    ports:
      - "6379:6379"